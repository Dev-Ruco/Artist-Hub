name: Mr. Bow — pre-visualizacao Web
on:
  push:
    branches: ['main']
  workflow_dispatch: {}
jobs:
  deploy_web:
    name: Publicar Expo Hosting (preview)
    type: deploy
    environment: preview
    params:
      prod: false
    hooks:
      # O Expo CLI precisa das dependencias (expo-router) para ler app.json.
      # Este hook corre APOS a instalacao automatica de node_modules.
      after_install_node_modules:
        - name: Associar projecto Expo existente
          run: npx --yes eas-cli@latest init --account ruco222 --non-interactive

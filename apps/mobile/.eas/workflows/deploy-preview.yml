name: Artist Hub — pre-visualizacao Web
on:
  push:
    branches: ['main']
  workflow_dispatch: {}
jobs:
  deploy_web:
    name: Publicar Expo Hosting (preview)
    type: deploy
    environment: preview
    params:
      prod: false
    hooks:
      after_checkout:
        - name: Associar projecto Expo ruco222/ruco
          run: |
            npx --yes eas-cli@latest init --account ruco222 --non-interactive

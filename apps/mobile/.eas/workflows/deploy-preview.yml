name: Artist Hub — pre-visualizacao Web
on:
  push:
    branches: ['main']
  workflow_dispatch: {}
jobs:
  deploy_web:
    name: Publicar Expo Hosting (preview)
    type: deploy
    environment: preview
    params:
      prod: false
    hooks:
      after_checkout:
        - name: Associar projecto Expo existente
          run: |
            if [ -z "${EAS_BUILD_PROJECT_ID:-}" ]; then
              echo "Identificador do projecto Expo nao disponivel neste executor."
              exit 1
            fi
            npx --yes eas-cli@latest init --id "$EAS_BUILD_PROJECT_ID" --non-interactive
